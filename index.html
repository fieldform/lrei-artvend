<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ART VEND</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <h1 class="text-5xl md:text-7xl font-bold text-center text-gray-800 mb-8">ART VEND</h1>
        <div id="content-section" class="bg-white rounded-lg shadow-lg p-6">
            <div id="loading" class="text-center text-gray-600 py-4">Loading...</div>
            <div id="data-container" class="overflow-x-auto"></div>
        </div>
    </div>

    <!-- Modal for enlarged images -->
    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>

    <script src="app.js"></script>
</body>
</html>
